[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noam"
version = "0.1.0"
description = "Noam engineering orchestrator and engineering-memory system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
noam = "noam.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noam"]

[tool.pytest.ini_options]
testpaths = ["tests/noam_core"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
